[project]
name = "truco-autoresearch"
version = "0.1.0"
description = "Automated CFR algorithm research for Truco solver"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.120.0",
    "openai>=2.48.0",
    # Tracking client only (no server/UI); enough to log params/metrics/artifacts
    # to a local file store or a remote tracking server.
    "mlflow-skinny>=2.20",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.16.0",
]

[tool.uv]
exclude-newer = "7 days"
# GHSA security update: permit fully patched GitPython 3.1.55, published
# 2026-07-23, before the normal age gate.
exclude-newer-package = { gitpython = "2026-07-24T00:00:00Z" }
package = false

[tool.uv.pip]
exclude-newer = "7 days"
exclude-newer-package = { gitpython = "2026-07-24T00:00:00Z" }
