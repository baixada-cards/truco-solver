[package]
name = "truco-solver"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
truco-engine.workspace = true
truco-policy-format.workspace = true
serde = { workspace = true }
serde_json = { workspace = true }
bincode = "1.3"
rand = { workspace = true }
ahash = "0.8"
smallvec = { version = "1.11", features = ["serde"] }
log = "0.4"
env_logger = "0.11"
indicatif = "0.18"
rayon = "1.10"
memmap2 = "0.9.11"

[features]
# Reduced-precision solve-time accumulators (plan 79 Phase 6 / plan 84 Phase 1):
# DenseAccum's regret/strategy/pending/last become f32, halving hot accumulator
# RAM. Checkpoint/strategy artifacts stay f64-formatted (widened on write), so
# files from both builds are byte-compatible. Traversal math stays f64; only
# the accumulator read/write boundary narrows.
accum-f32 = []

[dev-dependencies]
proptest = "1.4"
